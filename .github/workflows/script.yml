name: CI — Build & Test

on:
  push:
    branches: ["Build_Artifacts"]
  pull_request:
    branches: ["Build_Artifacts"]
  workflow_dispatch:          # allows manual trigger from GitHub UI

# ── Configure your paths here ────────────────────────────────────────────────
# RELEASE_DIR  : folder your build_exe.ps1 writes ALL output into
# EXE_PATH     : exact path to the .exe inside that folder
# Change these two lines and nothing else needs to touch paths.
env:
  RELEASE_DIR: .
  EXE_PATH:    release/tool/NvMAutomationTool.exe

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: windows-latest   # required — Makefile uses PowerShell and .ps1 scripts

    defaults:
      run:
        shell: pwsh            # use PowerShell Core for all steps

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"               # caches pip download cache between runs

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Test ──────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      # ── 5. Build executable ──────────────────────────────────────────────────
      - name: Build executable
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\build_exe.ps1

      # ── 6. Upload full release folder ────────────────────────────────────────
      - name: Upload full release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvm-tool-release-${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 30
          if-no-files-found: error      # fail loudly if build produced nothing

      # ── 7. Upload EXE only ───────────────────────────────────────────────────
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvm-tool-exe-${{ github.run_number }}
          path: ${{ env.EXE_PATH }}
          retention-days: 30
          if-no-files-found: error